<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #3E5A34; text-decoration: none; }
    a:hover { color: #2C4125; }
    input::placeholder { color: #8B9482; }
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#EAF1E2;border-radius:28px;box-shadow:0 1px 2px rgba(32,43,29,0.08);">
  <div style="width:100%;height:100%;display:flex;flex-direction:column;font-family:'Work Sans', sans-serif;color:#202B1D;">

    <!-- Brand identity -->
    <div style="padding:48px 24px 0;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;">
      <svg width="46" height="46" viewBox="0 0 44 44">
        <circle cx="20" cy="20" r="19" fill="#3E5A34"/>
        <circle cx="30" cy="30" r="9" fill="{{accent}}"/>
      </svg>
      <span style="font-family:'Newsreader', serif;font-size:30px;font-weight:600;letter-spacing:-0.01em;">Linka</span>
    </div>

    <!-- Title -->
    <div style="padding:30px 36px 0;text-align:center;flex-shrink:0;">
      <h1 style="font-family:'Newsreader', serif;font-weight:500;font-size:22px;line-height:1.4;margin:0;letter-spacing:-0.01em;color:#202B1D;">Ce que tu ressens,<br/><span style="font-style:italic;color:{{accent}};">sans les mots</span>.</h1>
    </div>

    <!-- Nature illustration -->
    <div style="padding:28px 0 0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg viewBox="0 0 240 260" width="210" height="227" fill="none">
        <path d="M120 244 C 118 184, 130 144, 118 94 C 110 64, 118 34, 130 14" stroke="#3E5A34" stroke-width="2" stroke-linecap="round"/>
        <path d="M118 154 C 90 144, 70 114, 78 84" stroke="#3E5A34" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M122 114 C 152 106, 176 80, 172 50" stroke="#3E5A34" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="78" cy="84" rx="17" ry="9" transform="rotate(-35 78 84)" stroke="#3E5A34" stroke-width="1.4"/>
        <ellipse cx="172" cy="50" rx="17" ry="9" transform="rotate(35 172 50)" stroke="#3E5A34" stroke-width="1.4"/>
        <circle cx="130" cy="14" r="7" fill="{{accent}}"/>
      </svg>
    </div>

    <!-- Login -->
    <div style="padding:32px 28px 40px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;">
      <input type="email" placeholder="Email" style="width:100%;background:#FBFAF6;border:1px solid #C9D6BC;border-radius:14px;padding:15px 16px;font-size:15px;font-family:inherit;color:#202B1D;outline:none;min-height:44px;"/>
      <input type="password" placeholder="Mot de passe" style="width:100%;background:#FBFAF6;border:1px solid #C9D6BC;border-radius:14px;padding:15px 16px;font-size:15px;font-family:inherit;color:#202B1D;outline:none;min-height:44px;"/>
      <div style="display:flex;justify-content:flex-end;">
        <a href="#" style="font-size:12px;color:#6B735C;">Mot de passe oublié ?</a>
      </div>
      <a href="#" style="width:100%;background:{{accent}};color:#FBFAF6;font-size:16px;font-weight:600;text-align:center;padding:15px 20px;border-radius:14px;min-height:44px;display:flex;align-items:center;justify-content:center;margin-top:2px;">Se connecter</a>
      <div style="text-align:center;margin-top:2px;">
        <a href="#" style="font-size:13px;font-weight:500;">Créer un compte</a>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B8433A","options":["#B8433A","#9C3730","#C1544A","#3E5A34"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B8433A' };
  }
}
</script>
</body>
</html>
