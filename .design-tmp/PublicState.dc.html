<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #3E5A34; text-decoration: none; }
    a:hover { color: #2C4125; }
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#EAF1E2;border-radius:28px;box-shadow:0 1px 2px rgba(32,43,29,0.08);">
  <div style="width:100%;height:100%;display:flex;flex-direction:column;font-family:'Work Sans', sans-serif;color:#202B1D;">

    <!-- Brand -->
    <div style="padding:44px 24px 0;display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;">
      <svg width="34" height="34" viewBox="0 0 44 44">
        <circle cx="20" cy="20" r="19" fill="#3E5A34"/>
        <circle cx="30" cy="30" r="9" fill="{{accent}}"/>
      </svg>
      <span style="font-family:'Newsreader', serif;font-size:19px;font-weight:600;letter-spacing:-0.01em;">Linka</span>
    </div>

    <!-- Centered state -->
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;gap:14px;text-align:center;">
      <span style="font-size:13px;color:#5A6650;">Léa te partage</span>
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:{{accent}};">Connexion</span>
      <h1 style="font-family:'Newsreader', serif;font-weight:500;font-size:30px;line-height:1.3;margin:0;">Complicité retrouvée</h1>
    </div>

    <!-- Footer CTA -->
    <div style="padding:0 28px 40px;display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;">
      <a href="#" style="width:100%;background:transparent;border:1.5px solid #202B1D;color:#202B1D;font-size:15px;font-weight:600;text-align:center;padding:14px 20px;border-radius:14px;min-height:44px;display:flex;align-items:center;justify-content:center;">Créer mon Linka</a>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B8433A","options":["#B8433A","#9C3730","#C1544A","#3E5A34"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B8433A' };
  }
}
</script>
</body>
</html>
