<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #3E5A34; text-decoration: none; }
    a:hover { color: #2C4125; }
    input::placeholder { color: #8B9482; }
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#EAF1E2;border-radius:28px;box-shadow:0 1px 2px rgba(32,43,29,0.08);">
  <div style="width:100%;height:100%;display:flex;flex-direction:column;font-family:'Work Sans', sans-serif;color:#202B1D;">

    <!-- Brand -->
    <div style="padding:44px 24px 0;display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;">
      <svg width="34" height="34" viewBox="0 0 44 44">
        <circle cx="20" cy="20" r="19" fill="#3E5A34"/>
        <circle cx="30" cy="30" r="9" fill="{{accent}}"/>
      </svg>
      <span style="font-family:'Newsreader', serif;font-size:19px;font-weight:600;letter-spacing:-0.01em;">Linka</span>
    </div>

    <!-- Centered form -->
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px;gap:20px;">
      <h1 style="font-family:'Newsreader', serif;font-weight:500;font-size:24px;text-align:center;margin:0;">Créer un compte</h1>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <input type="text" placeholder="Nom d'utilisateur" style="width:100%;background:#FBFAF6;border:1px solid #C9D6BC;border-radius:14px;padding:15px 16px;font-size:15px;font-family:inherit;color:#202B1D;outline:none;min-height:44px;"/>
        <input type="email" placeholder="Email" style="width:100%;background:#FBFAF6;border:1px solid #C9D6BC;border-radius:14px;padding:15px 16px;font-size:15px;font-family:inherit;color:#202B1D;outline:none;min-height:44px;"/>
        <input type="password" placeholder="Mot de passe" style="width:100%;background:#FBFAF6;border:1px solid #C9D6BC;border-radius:14px;padding:15px 16px;font-size:15px;font-family:inherit;color:#202B1D;outline:none;min-height:44px;"/>
      </div>

      <a href="#" style="width:100%;background:{{accent}};color:#FBFAF6;font-size:16px;font-weight:600;text-align:center;padding:15px 20px;border-radius:14px;min-height:44px;display:flex;align-items:center;justify-content:center;">Créer mon compte</a>

      <div style="text-align:center;">
        <a href="#" style="font-size:13px;font-weight:500;">J'ai déjà un compte</a>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B8433A","options":["#B8433A","#9C3730","#C1544A","#3E5A34"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B8433A' };
  }
}
</script>
</body>
</html>
