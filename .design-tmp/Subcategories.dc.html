<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #3E5A34; text-decoration: none; }
    a:hover { color: #2C4125; }
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#EAF1E2;border-radius:28px;box-shadow:0 1px 2px rgba(32,43,29,0.08);">
  <div style="width:100%;height:100%;display:flex;flex-direction:column;font-family:'Work Sans', sans-serif;color:#202B1D;">

    <!-- Header -->
    <div style="padding:24px 24px 0;display:flex;align-items:center;gap:14px;flex-shrink:0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202B1D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <h1 style="font-family:'Newsreader', serif;font-weight:500;font-size:19px;margin:0;">Connexion</h1>
    </div>

    <!-- Subcategory list -->
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 24px;gap:10px;">
      <sc-for list="{{subcategories}}" as="item" hint-placeholder-count="4">
        <a href="#" style="background:#FBFAF6;border:1px solid #C9D6BC;border-radius:14px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;min-height:44px;">
          <span style="font-family:'Newsreader', serif;font-size:16px;font-weight:500;color:#202B1D;">{{item.name}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B8433A","options":["#B8433A","#9C3730","#C1544A","#3E5A34"]}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Complicité retrouvée', 'Confiance grandissante', 'Rires partagés', 'Silence confortable'];
    return {
      accent: this.props.accent ?? '#B8433A',
      subcategories: names.map((name) => ({ name }))
    };
  }
}
</script>
</body>
</html>
