<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #3E5A34; text-decoration: none; }
    a:hover { color: #2C4125; }
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#EAF1E2;border-radius:28px;box-shadow:0 1px 2px rgba(32,43,29,0.08);">
  <div style="width:100%;height:100%;display:flex;flex-direction:column;font-family:'Work Sans', sans-serif;color:#202B1D;">

    <!-- Top bar -->
    <div style="padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="28" height="28" viewBox="0 0 44 44">
          <circle cx="20" cy="20" r="19" fill="#3E5A34"/>
          <circle cx="30" cy="30" r="9" fill="{{accent}}"/>
        </svg>
        <span style="font-family:'Newsreader', serif;font-size:17px;font-weight:600;letter-spacing:-0.01em;">Linka</span>
      </div>
      <div style="width:32px;height:32px;border-radius:50%;background:#E3E8DC;display:flex;align-items:center;justify-content:center;font-family:'Newsreader', serif;font-weight:600;font-size:13px;color:#3E5A34;">L</div>
    </div>

    <!-- Centered content -->
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 24px;gap:22px;">

      <a href="#" style="width:100%;background:{{accent}};color:#FBFAF6;font-size:16px;font-weight:600;text-align:center;padding:16px 20px;border-radius:14px;min-height:44px;display:flex;align-items:center;justify-content:center;">Générer un état</a>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#4F5A44;">Mes états</span>

        <div style="background:#FBFAF6;border:1px solid #C9D6BC;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;">
          <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#8FA888;">Après</span>
          <span style="font-family:'Newsreader', serif;font-size:17px;font-weight:500;">Paix retrouvée</span>
          <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span style="font-size:12px;color:#6B735C;">linka.app/lea/9k2p</span>
          </div>
        </div>

        <div style="background:#FBFAF6;border:1px solid #C9D6BC;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;">
          <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#8FA888;">Tension</span>
          <span style="font-family:'Newsreader', serif;font-size:17px;font-weight:500;">Besoin d'air</span>
          <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span style="font-size:12px;color:#6B735C;">linka.app/lea/3h8d</span>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B8433A","options":["#B8433A","#9C3730","#C1544A","#3E5A34"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B8433A' };
  }
}
</script>
</body>
</html>
